{% extends "base.html" %}
{% block content %}
<div class="card">
  <h2>🕘 Riwayat Pembaruan Aplikasi</h2>
  <p style="font-size:.8rem;color:#666;margin-top:-4px">Catatan perubahan tiap kali aplikasi ini diperbarui.</p>
  {% for entry in changelog %}
  <div style="border-left:3px solid var(--blue);padding:4px 0 4px 14px;margin-bottom:16px">
    <div style="font-size:.75rem;color:#789;font-weight:700">{{ entry.tanggal }}</div>
    <div style="font-weight:700;color:var(--navy);margin:2px 0 6px">{{ entry.judul }}</div>
    <ul style="margin:0;padding-left:18px;font-size:.85rem">
      {% for d in entry.detail %}
        <li>{{ d }}</li>
      {% endfor %}
    </ul>
  </div>
  {% endfor %}
</div>
{% endblock %}
