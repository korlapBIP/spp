<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login — SPP Omah Bocil</title>
<link rel="icon" href="{{ url_for('static', filename='logo_omahbocil.png') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header>
<div style="display:flex;align-items:center;gap:10px">
  <img src="{{ url_for('static', filename='logo_omahbocil.png') }}" alt="Logo Omah Bocil" style="height:56px;width:auto">
  <div>
    <h1>Omah Bocil — SPP Manager</h1>
    <p>Bimbingan Belajar Omah Bocil · Teman Belajar, Raih Prestasi!</p>
  </div>
</div>
</header>
<main style="max-width:400px">
{% with messages = get_flashed_messages(with_categories=true) %}
  {% for category, message in messages %}
    <div class="flash {{ category }}">{{ message }}</div>
  {% endfor %}
{% endwith %}
<div class="card">
  <h2>🔐 Login Admin</h2>
  <form method="post">
    <div class="row">
      <div><label>Username</label><input name="username" required autofocus></div>
    </div>
    <div class="row" style="margin-top:8px">
      <div><label>Password</label><input name="password" type="password" required></div>
    </div>
    <div style="margin-top:12px">
      <button class="btn yellow" type="submit" style="width:100%">Login</button>
    </div>
  </form>
</div>
</main>
</body>
</html>
